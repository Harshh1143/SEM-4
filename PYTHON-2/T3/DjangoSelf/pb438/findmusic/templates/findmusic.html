{% extends 'base.html' %}
{% block content %}


    <form method="GET">
      <h1>Welcome</h1>
      <h2>Let's search your Music</h2>
      <input name="song" class="input" type="text" placeholder=" " />
      <label for="song"> Song </label>
      <input name="artist" type="text" placeholder=" " />
      <label for="artist"> Artist </label>
      <input name="year" type="text" placeholder=" " />
      <label for="year"> Year </label>
      <input name="album" type="text" placeholder=" " />
      <label for="album"> Album </label>
      <button type="submit">Submit</button>
    </form>
    <table border="1">
      <tr>
        <th>Song</th>
        <th>Artist</th>
        <th>Year</th>
        <th>Album</th>
      </tr>
      {% for s in song %}
      <p>Total Songs: {{ song|length }}</p>
      <tr>
        <th>{{s.song}}</th>
        <th>{{s.artist}}</th>

        <th>{{s.year}}</th>
        <th>{{s.album}}</th>
      </tr>
      {% endfor %}
    </table>
    {% endblock %}
