<html>
  <head>
    <title>Upcoming Seminars</title>
  </head>
  <body>
    <h1>Upcoming Seminars</h1>
    <form method="GET">
      <input type="text" name="title" placeholder="Search by seminar title" />
      <button type="submit">Search</button>
    </form>
    <table border="1">
      <thead>
        <tr>
          <th>SeminarTitle</th>
          <th>Date</th>
          <th>Organizer</th>
          <th>Department</th>
        </tr>
      </thead>
      <tbody>
        {% for i in title %}
        <tr>
          <td>{{i.title}}</td>
          <td>{{i.date}}</td>
          <td>{{i.organizer}}</td>
          <td>{{i.department}}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    <br />
    <a href="/departments/">View Departments</a>
  </body>
</html>
