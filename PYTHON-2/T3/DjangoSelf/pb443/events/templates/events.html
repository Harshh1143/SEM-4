<html>
  <head>
    <title>Upcoming Events</title>
  </head>
  <body>
    <h1>Upcoming Events</h1>
    <form method="GET">
      <input type="text" name="q" placeholder="Search by event name" />
      <button type="submit">Search</button>
    </form>
    <table border="1">
      <thead>
        <tr>
          <th>Event Name</th>
          <th>Event Date</th>
          <th>Location</th>
          <th>Category</th>
        </tr>
      </thead>
      <tbody>
        {% for i in event %}
        <tr>
          <td>{{i.event}}</td>
          <td>{{i.date}}</td>
          <td>{{i.location}}</td>
          <td>{{i.category}}</td>
        </tr>
      </tbody>
      {% endfor %}
    </table>
    <br />
    <a href="/category/">View Event Categories</a>
  </body>
</html>
