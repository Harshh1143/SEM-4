{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}P3{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
    <style>
      :root {
        --bg: #f7f3ee;
        --surface: #ffffff;
        --ink: #1d2433;
        --muted: #667085;
        --line: #e7dfd4;
        --brand: #0f766e;
        --brand-dark: #115e59;
        --accent: #f97316;
        --shadow: 0 18px 45px rgba(29, 36, 51, 0.12);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--ink);
        line-height: 1.6;
      }

      .navbar {
        width: min(1120px, calc(100% - 32px));
        margin: 18px auto 0;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: 0 10px 30px rgba(29, 36, 51, 0.08);
        padding: 12px 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 12px;
        z-index: 10;
        backdrop-filter: blur(12px);
      }

      .navbar-brand {
        color: var(--brand-dark);
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0;
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .brand-mark {
        width: 36px;
        height: 36px;
        border-radius: 8px;
        background: var(--brand);
        color: #fff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        font-weight: 800;
      }

      .navbar-menu {
        display: flex;
        align-items: center;
        gap: 6px;
        list-style: none;
      }

      .navbar-link {
        color: var(--muted);
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        padding: 10px 14px;
        text-decoration: none;
        transition:
          background 0.2s ease,
          color 0.2s ease;
      }

      .navbar-link:hover,
      .navbar-link.active {
        background: #ecfdf5;
        color: var(--brand-dark);
      }

      .page-content {
        width: min(1120px, calc(100% - 32px));
        margin: 26px auto 56px;
      }

      .hero {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(280px, 0.9fr);
        gap: 32px;
        padding: 42px;
        overflow: hidden;
      }

      .hero-text {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 18px;
      }

      .eyebrow {
        color: var(--accent);
        font-size: 13px;
        font-weight: 800;
        text-transform: uppercase;
      }

      h1 {
        color: var(--ink);
        font-size: 44px;
        line-height: 1.1;
      }

      p {
        color: var(--muted);
        font-size: 17px;
      }

      .hero-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 8px;
      }

      .btn {
        border-radius: 8px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        min-height: 44px;
        padding: 10px 18px;
        text-decoration: none;
      }

      .btn-primary {
        background: var(--brand);
        color: #fff;
      }

      .btn-secondary {
        border: 1px solid var(--line);
        color: var(--brand-dark);
        background: #fff;
      }

      .hero-media {
        background: #e7f5f2;
        border-radius: 8px;
        min-height: 300px;
        overflow: hidden;
      }

      .hero-media img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
      }

      .section {
        margin-top: 28px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 24px;
        box-shadow: 0 12px 30px rgba(29, 36, 51, 0.07);
      }

      .card h2,
      .card h3 {
        color: var(--ink);
        font-size: 22px;
        margin-bottom: 8px;
      }

      .simple-page {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
        padding: 40px;
      }

      .simple-page h1 {
        margin-bottom: 14px;
      }

      @media (max-width: 600px) {
        .navbar {
          align-items: flex-start;
          flex-direction: column;
          gap: 14px;
          padding: 16px 20px;
        }

        .navbar-menu {
          flex-wrap: wrap;
          gap: 8px;
        }

        .page-content {
          width: min(100% - 24px, 1120px);
          margin-top: 18px;
        }

        .hero,
        .simple-page {
          padding: 24px;
        }

        .hero {
          grid-template-columns: 1fr;
        }

        h1 {
          font-size: 34px;
        }

        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <a class="navbar-brand" href="{% url 'home' %}">
        <span class="brand-mark">P3</span>
        <span>Project 3</span>
      </a>
      <ul class="navbar-menu">
        <li>
          <a
            class="navbar-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}"
            href="{% url 'home' %}"
            >Home</a
          >
        </li>
        <li>
          <a
            class="navbar-link {% if request.resolver_match.url_name == 'about' %}active{% endif %}"
            href="{% url 'about' %}"
            >About</a
          >
        </li>
        <li>
          <a
            class="navbar-link {% if request.resolver_match.url_name == 'contact' %}active{% endif %}"
            href="{% url 'contact' %}"
            >Contact</a
          >
        </li>
      </ul>
    </nav>

    <main class="page-content">
      {% block content %}hello{% endblock %}
      <h1>{{n}}</h1>
      <h3>{{num}}</h3>
    </main>
  </body>
</html>
