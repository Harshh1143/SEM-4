<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Page</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        background-color: #f4f4f4;
      }

      /* Header */
      header {
        background: #333;
        color: white;
        padding: 15px;
        text-align: center;
      }

      nav a {
        color: white;
        margin: 0 10px;
        text-decoration: none;
      }

      nav a:hover {
        text-decoration: underline;
      }

      /* Main */
      main {
        padding: 20px;
        text-align: center;
      }

      /* Button */
      .btn {
        display: inline-block;
        padding: 10px 20px;
        background: #007bff;
        color: white;
        text-decoration: none;
        border-radius: 5px;
      }

      .btn:hover {
        background: #0056b3;
      }

      /* Form */
      form {
        background: white;
        padding: 20px;
        max-width: 400px;
        margin: auto;
        border-radius: 8px;
      }

      input,
      textarea {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
      }

      button {
        width: 100%;
        padding: 10px;
        background: green;
        color: white;
        border: none;
        cursor: pointer;
      }

      button:hover {
        background: darkgreen;
      }
    </style>
  </head>
  <body>
    <main>
      <form method="get" action="/savesession">
        <label>Name:</label>
        <input
          type="text"
          placeholder="Enter your name"
          required
          name="fname"
        />

        <label>Password</label>
        <input
          type="password"
          placeholder="Enter your pass"
          required
          name="pwd"
        />

        <button type="submit">Submit</button>
      </form>
    </main>
  </body>
</html>
