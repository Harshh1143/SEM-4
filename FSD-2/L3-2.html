<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="p1"></p>
    <script>
        let a = 5
        let b = 2
        let count = 0
        const i = setInterval(()=>{
            document.getElementById("p1").innerHTML=(++a)+(++b)
            count++
            if(count==5){
                clearInterval(i)
            }
        },3000)
    </script>
</body>
</html>
