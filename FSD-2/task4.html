<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="func()">Click Me</button>
    <p id="demo"></p>
    <script>
        function func() {
            const obj = JSON.parse(`{"name":"xyz","age":"17","dob":"1997-03-14"}`);

            console.log(obj.dob);

            a = new Date(obj.dob);

            console.log(a);
            document.getElementById('demo').innerHTML="Birthday of " + obj.name + " is " + a
        }
    </script>
</body>
</html>
