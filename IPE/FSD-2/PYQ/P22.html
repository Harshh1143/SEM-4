<!doctype html>
<html>
  <head>
    <title>Employee Form</title>
  </head>
  <body>
    <h2>Employee Details</h2>

    <form action="/save" method="POST">
      Name :
      <input type="text" name="name" /><br /><br />

      Email :
      <input type="email" name="email" /><br /><br />

      Date of Joining :
      <input type="date" name="doj" /><br /><br />

      <input type="submit" value="Save" />
      <input type="reset" />
    </form>
  </body>
</html>
